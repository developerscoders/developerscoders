<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Pallav Burnwal, Full-Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a4a"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0.05"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="240" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1000" height="240" fill="url(#bg)"/>

    <!-- slow drifting dots -->
    <g fill="#7dd3fc" opacity="0.5">
      <circle cx="120" cy="40" r="2"><animate attributeName="cy" values="40;30;40" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="310" cy="70" r="1.5"><animate attributeName="cy" values="70;58;70" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="720" cy="35" r="2"><animate attributeName="cy" values="35;47;35" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="880" cy="75" r="1.5"><animate attributeName="cy" values="75;63;75" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <!-- back wave -->
    <path fill="url(#w2)" d="M0,195 q62.5,-40 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 L1500,240 L0,240 Z">
      <animateTransform attributeName="transform" type="translate" from="-250 0" to="0 0" dur="11s" repeatCount="indefinite"/>
    </path>
    <!-- front wave -->
    <path fill="url(#w1)" d="M0,180 q62.5,-40 125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 t125,0 L1500,240 L0,240 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-250 0" dur="8s" repeatCount="indefinite"/>
    </path>

    <!-- name: fades and slides up -->
    <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f8fafc" opacity="0">
      Pallav Burnwal
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 18" to="0 0" dur="1.2s" begin="0.2s" fill="freeze"/>
    </text>

    <!-- subtitle: fades in after the name -->
    <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#7dd3fc" opacity="0">
      Full-Stack Developer  |  Building AI products
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="1.1s" fill="freeze"/>
    </text>
  </g>
</svg>
